name: Release Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform_name: linux
            cmake_c_flags: ""
            cmake_cxx_flags: ""
            macos_deployment_target: ""
            ggml_native: ""
          - runner: macos-15
            platform_name: macos
            cmake_c_flags: -D_LIBCPP_DISABLE_AVAILABILITY
            cmake_cxx_flags: -D_LIBCPP_DISABLE_AVAILABILITY
            macos_deployment_target: "15.0"
            ggml_native: "OFF"
          - runner: windows-2025
            platform_name: windows
            cmake_c_flags: ""
            cmake_cxx_flags: ""
            macos_deployment_target: ""
            ggml_native: ""

    runs-on: ${{ matrix.runner }}
    env:
      CMAKE_C_FLAGS: ${{ matrix.cmake_c_flags }}
      CMAKE_CXX_FLAGS: ${{ matrix.cmake_cxx_flags }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
      CMAKE_OSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
      GGML_NATIVE: ${{ matrix.ggml_native }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Sync desktop version from tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node ./scripts/sync-desktop-version.mjs "${RELEASE_VERSION}"

      - name: Load release notes from changelog
        id: release_notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node <<'EOF'
          const fs = require("node:fs");

          const tagName = process.env.TAG_NAME;
          const version = tagName.replace(/^v/, "");
          const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
          const headingPrefix = `## [${version}] - `;
          const start = lines.findIndex((line) => line.startsWith(headingPrefix));

          if (start === -1) {
            throw new Error(`Missing CHANGELOG entry for ${tagName}`);
          }

          let end = lines.length;

          for (let index = start + 1; index < lines.length; index += 1) {
            if (lines[index].startsWith("## [")) {
              end = index;
              break;
            }
          }

          const bodyLines = lines.slice(start + 1, end);

          while (bodyLines[0] === "") {
            bodyLines.shift();
          }

          while (bodyLines.at(-1) === "") {
            bodyLines.pop();
          }

          if (bodyLines.length === 0) {
            throw new Error(`CHANGELOG entry for ${tagName} is empty`);
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `body<<CHANGELOG_BODY\n${bodyLines.join("\n")}\nCHANGELOG_BODY\n`,
          );
          EOF

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Tator ${{ github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  mirror-whisper-models:
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23

      - name: Download whisper model mirror assets
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");
          const { Readable } = require("node:stream");
          const { pipeline } = require("node:stream/promises");

          const catalog = JSON.parse(fs.readFileSync("apps/desktop/src-tauri/resources/whisper-models.json", "utf8"));
          const outputDir = path.resolve("dist", "whisper-models");
          fs.mkdirSync(outputDir, { recursive: true });

          async function sha1ForFile(filePath) {
            return await new Promise((resolve, reject) => {
              const hash = crypto.createHash("sha1");
              const stream = fs.createReadStream(filePath);
              stream.on("error", reject);
              stream.on("data", (chunk) => hash.update(chunk));
              stream.on("end", () => resolve(hash.digest("hex")));
            });
          }

          async function downloadModel(spec) {
            const destination = path.join(outputDir, spec.fileName);
            const tempPath = `${destination}.download`;
            fs.rmSync(tempPath, { force: true });

            const errors = [];
            for (const url of spec.urls) {
              try {
                const response = await fetch(url);
                if (!response.ok || !response.body) {
                  throw new Error(`${response.status} ${response.statusText}`);
                }

                await pipeline(Readable.fromWeb(response.body), fs.createWriteStream(tempPath));

                const digest = await sha1ForFile(tempPath);
                if (digest !== spec.sha1) {
                  throw new Error(`SHA1 mismatch: expected ${spec.sha1}, got ${digest}`);
                }

                fs.renameSync(tempPath, destination);
                return;
              } catch (error) {
                fs.rmSync(tempPath, { force: true });
                errors.push(`${url}: ${error instanceof Error ? error.message : String(error)}`);
              }
            }

            throw new Error(`Unable to mirror ${spec.fileName}. ${errors.join(" | ")}`);
          }

          (async () => {
            for (const spec of catalog) {
              await downloadModel(spec);
            }
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          EOF

      - name: Upload whisper model mirror assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/whisper-models/* --clobber
