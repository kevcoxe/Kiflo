name: Debug Desktop Bundle

on:
  push:
    branches:
      - "codex/debug-desktop-bundle"
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to build
        required: true
        default: main
      release_version:
        description: Release version or tag to stamp into the desktop app
        required: true
        default: v0.2.0

permissions:
  contents: read

jobs:
  debug-bundle:
    name: Debug bundle (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform_name: macos
            cmake_c_flags: -D_LIBCPP_DISABLE_AVAILABILITY
            cmake_cxx_flags: -D_LIBCPP_DISABLE_AVAILABILITY
            macos_deployment_target: "15.0"
          - runner: windows-2025
            platform_name: windows
            cmake_c_flags: ""
            cmake_cxx_flags: ""
            macos_deployment_target: ""

    env:
      CMAKE_C_FLAGS: ${{ matrix.cmake_c_flags }}
      CMAKE_CXX_FLAGS: ${{ matrix.cmake_cxx_flags }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
      CMAKE_OSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Resolve debug build metadata
        id: metadata
        run: |
          set -euo pipefail

          git_ref="${{ github.event.inputs.git_ref || github.ref_name }}"
          release_version="${{ github.event.inputs.release_version }}"

          if [[ -z "$release_version" ]]; then
            release_version="v$(node -p "require('./apps/desktop/package.json').version")"
          fi

          {
            echo "git_ref=$git_ref"
            echo "release_version=$release_version"
          } >>"$GITHUB_OUTPUT"

      - name: Sync desktop version from input
        run: node ./scripts/sync-desktop-version.mjs "${{ steps.metadata.outputs.release_version }}"

      - name: Build Tauri bundle
        env:
          CI: "true"
        run: npm run tauri:build --workspace @tator/desktop

      - name: Collect bundle artifacts
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.release_version }}
          RUNNER_LABEL: ${{ matrix.runner }}
          GIT_REF_NAME: ${{ steps.metadata.outputs.git_ref }}
        shell: bash
        run: |
          set -euo pipefail

          artifact_root="debug-artifacts/${RUNNER_LABEL}"

          mkdir -p "$artifact_root"
          cp -R apps/desktop/src-tauri/target/release/bundle "$artifact_root/bundle"
          cp -R apps/desktop/src-tauri/target/bundled-whisper-model "$artifact_root/bundled-whisper-model"

          {
            echo "release_version=${RELEASE_VERSION}"
            echo "runner_label=${RUNNER_LABEL}"
            echo "git_ref=${GIT_REF_NAME}"
            echo "git_sha=$(git rev-parse HEAD)"
            echo "platform_name=${{ matrix.platform_name }}"
            echo "bundle_dir=apps/desktop/src-tauri/target/release/bundle"
          } >"$artifact_root/metadata.txt"

      - name: Upload debug artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-debug-${{ matrix.runner }}-${{ steps.metadata.outputs.release_version }}
          path: debug-artifacts/${{ matrix.runner }}
          if-no-files-found: warn
          retention-days: 14
